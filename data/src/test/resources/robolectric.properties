# Default Application class for ALL Robolectric unit tests in :data.
#
# This is the per-module duplicate of `app/src/test/resources/robolectric.properties`,
# adjusted for :data's situation (no Application declared in :data's manifest).
#
# Why pin it anyway
# -----------------
# :data's AndroidManifest.xml has no `android:name`, so Robolectric's
# default would already be `android.app.Application`. We pin it explicitly
# to keep the contract uniform with :app, so a future addition of a
# library-side Application doesn't silently change Robolectric loading
# behavior in this module. The :app-side leak rationale (ACRA + Timber
# trees + AnrReporter coroutine etc.) doesn't apply here because :data
# has none of that init code, but the discipline of "tests pin their
# Application" is module-wide.
#
# Tests that need Hilt continue to set
# @Config(application = HiltTestApplication::class) per-test, which
# overrides this default. Currently no :data tests do — the migrated
# Repository-Impl tests are pure-JVM or Robolectric-without-Hilt.
#
# See also: app/src/test/java/com/github/reygnn/kolibri_launcher/
# TESTING_CONVENTIONS.kt section "ROBOLECTRIC APPLICATION CONFIG — TWO-LAYER
# STRATEGY" for the full picture.
application=android.app.Application
