# Robolectric defaults for ALL unit tests in :app.
#
# Application default
# -------------------
# AndroidManifest.xml declares android:name=".NyxApplication". Without an
# override, Robolectric loads that production Application for every test, and
# @HiltAndroidApp's onCreate() plants a Timber tree and calls
# PackageEventCoordinator.start() — none of which is torn down between tests, so
# each Robolectric test class would leak them.
#
# Setting the global default to android.app.Application (a no-op) keeps every
# Robolectric test on a stub. Tests that need Hilt set
# @Config(application = HiltTestApplication::class) per-test, which overrides
# this default.
#
# DO NOT remove this without setting an equivalent override on every Robolectric
# test class, or the leak comes back.
application=android.app.Application

# Robolectric ships SDK jars up to API 36 (4.16.1); the app compiles/targets 37.
# Pin the emulated SDK to 36 so Robolectric runs against a supported level
# regardless of the app targetSdk.
sdk=36
