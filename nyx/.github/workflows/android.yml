name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # `:domain` is a pure-Kotlin JVM module (`kotlin("jvm")`), so it has no
      # debug variant and NO `testDebugUnitTest` task — a bare
      # `./gradlew testDebugUnitTest` would silently skip the whole use-case /
      # domain-model layer. `:domain:test` is named explicitly so it runs too,
      # without dragging in the release unit-test variant of the Android modules.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :domain:test --stacktrace

      # Android Lint on the debug variant.
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      # Build the debug APK as a packaging gate (catches manifest/resource/
      # assembly errors the unit tests don't). Not uploaded as an artifact —
      # releases ship via local `bundleRelease` + install-aab.sh.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/'
          retention-days: 14
