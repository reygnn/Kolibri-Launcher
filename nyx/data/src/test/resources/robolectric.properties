# Robolectric defaults for ALL unit tests in :data.
#
# Application default
# -------------------
# :data's source set has no AndroidManifest with an android:name, so
# Robolectric's own default would already be android.app.Application. We pin
# it explicitly to keep the contract uniform with :app (see that module's
# robolectric.properties), so a future library-side Application can't silently
# change Robolectric loading behavior here. The :app leak rationale (Hilt app +
# Timber + PackageEventCoordinator init) doesn't apply in :data, but the
# discipline of "tests pin their Application" is module-wide.
#
# Tests that need Hilt set @Config(application = HiltTestApplication::class)
# per-test, which overrides this default.
application=android.app.Application

# Robolectric ships SDK jars up to API 36 (4.16.1); the app compiles/targets 37.
# Pin the emulated SDK to 36 so Robolectric runs against a supported level
# regardless of the app targetSdk. (sdk=34 broke here: the built manifest
# requires #36, which a #34 sandbox can't parse.)
sdk=36
