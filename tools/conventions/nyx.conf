# Nyx — data for tools/check-conventions.sh (A3). Data only, no logic.
APP_DIR="$MONO/nyx"
APP_MAIN_ROOTS=("$APP_DIR/app/src/main/java" "$APP_DIR/domain/src/main/java" "$APP_DIR/data/src/main/java")
APP_UI_ROOT="$APP_DIR/app/src/main/java"
APP_RES_DIR="$APP_DIR/app/src/main/res"
APP_TEST_MODULES=("$APP_DIR/app" "$APP_DIR/data" "$APP_DIR/domain")

# Positive lists (app-own files; shared ones live in tools/shared-lint-files.sh).
RULE11_FILES=()          # filled in Phase 1a (Rule-11 review of the 23 runCatching sites)
CANCEL_FILES=(
  "$APP_DIR/app/src/main/java/com/github/reygnn/nyx_launcher/home/MainActivity.kt"
  # loadFromDiskOrResolve (suspend) wraps the non-suspend writeDisk in runCatching —
  # safe today (no suspension point marker), locked against a suspend-flip of writeDisk.
  "$APP_DIR/data/src/main/java/com/github/reygnn/nyx_launcher/data/icon/IconLoaderImpl.kt"
)
OOM_FILES=()
INITORDER_FILES=(
  "$APP_DIR/data/src/main/java/com/github/reygnn/nyx_launcher/data/icon/FolderIconRenderer.kt"
)

NAMING_DATA_DIR="$APP_DIR/data/src/main/java/com/github/reygnn/nyx_launcher/data"
NAMING_ALLOWED=''
PURGE_ROOTS=("$APP_DIR/data/src/main/java")
KEEPLIST_ROOTS=("$APP_DIR/app/src/main/java" "$APP_DIR/data/src/main/java" "$MONO/common-data/src/main/java")
KEEPLIST_NONSETTINGS_WRITERS=""
KEEPLIST_BINDING_FILES=()

# Decisions — one per registered check: RUN · TASK · "SKIP: <reason>".
# Every SKIP names the spec step that turns it into RUN.
CHECK=(
  [rule9]=RUN [rule12]=RUN [toast]=RUN [rule11]=RUN [cancel]=RUN [initorder]=RUN
  [flowcatch]=RUN [sharedflow]=RUN [arresult]=RUN [adapter]=RUN [oom]=RUN
  [parity]=RUN [triple]=RUN [testconv]=RUN
  [naming]="SKIP: NyxBackupManager/NyxResetManager still exist; they disappear in Phase 2b, then RUN"
  [purge]="SKIP: no purgeRepository() in Nyx yet; Nyx stores become Purgeable in Phase 2b, then RUN"
  [keeplist]="SKIP: Nyx has no storage cleanup yet; introduced in Phase 4b (E5b), then RUN"
  [stalereplay]="SKIP: no Nyx whitelist yet; Phase 1a step turns it into TASK"
  [rule13]=TASK        # :nyx:app:checkRule13
)
