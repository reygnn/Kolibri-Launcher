KEEPLIST_BINDING_FILES=()

# Stale-replay gate (tools/check-stale-replay-read.sh --app <app>, Gradle task
# checkStaleReplayRead): hot, replay-caching flows that get point-read, and the
# reviewed files that point-read them. EMPTY in both apps: every DataStore flow is
# cold (DATASTORE_READ_SPEC), so the class is structurally absent and the gate runs
# dormant — not deleted, so a re-introduced hot share is caught the same way in both.
STALE_HOT_FLOWS=()
STALE_FILES=()

# Decisions — one per registered check: RUN · TASK · "SKIP: <reason>".
# Every SKIP names the spec step that turns it into RUN.
CHECK=(
  [rule9]=RUN [rule12]=RUN [toast]=RUN [rule11]=RUN [cancel]=RUN [initorder]=RUN
  [flowcatch]=RUN [sharedflow]=RUN [arresult]=RUN [adapter]=RUN [oom]=RUN
  [parity]=RUN [triple]=RUN [testconv]=RUN [whilesub]=RUN [mirror]=RUN [harddisp]=RUN [buildparity]=RUN [apostrophe]=RUN
  [legacysunset]="SKIP: Nyx binds no LegacyFormatReader (no Nyx backups in circulation, SPEC_NYX_REWRITE E5a)"
  [naming]=RUN   # 2b-4c: no *Manager left in data/ (NyxBackupManager → BackupRepositoryImpl, NyxResetManager → ResetRepositoryImpl)
  [purge]=RUN    # 2b-4c: every Nyx store is Purgeable; NyxWallpaperDisplaySettings/NyxFabPositionStore only via ResetCompletenessContract
  [keeplist]="SKIP: Nyx has no storage cleanup yet; introduced in Phase 4b (E5b), then RUN"
  [stalereplay]=TASK   # :nyx:app:checkStaleReplayRead (rides along with checkConventions).
                       # Nyx UI StateFlows read via `.value` (MainActivity, AppDrawerFragment) are
                       # collected under repeatOnLifecycle(STARTED) in the same component → warm.
  [rule13]=TASK        # :nyx:app:checkRule13
)
