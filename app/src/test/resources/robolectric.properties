# Default Application class for ALL Robolectric unit tests in this project.
#
# Why this exists
# ---------------
# AndroidManifest.xml declares android:name=".KolibriLauncherApp". Without an
# override, Robolectric loads that production Application for every test, and
# its onCreate() installs ACRA's global UncaughtExceptionHandler, plants Timber
# trees, registers a BroadcastReceiver, creates a CoroutineScope, and (post-
# 2026-05-06) launches the AnrReporter coroutine. None of that is torn down
# between tests, so each Robolectric test class leaks one of each.
#
# With ~10+ Robolectric test classes and the test executor at -Xmx512m, the
# accumulated handlers / threads / receivers push the heap over the edge.
# Historic note: pre-2026-05-06 the worst leaker was ANRWatchDog 1.4.0 (a
# non-daemon thread sampling the main thread every 5s for the JVM lifetime;
# symptom "OutOfMemoryError thrown from the UncaughtExceptionHandler in thread
# |ANR-WatchDog|"). The dependency is gone, but the file is still load-bearing
# because ACRA + Timber alone cause the same cross-test bleed-through.
#
# Setting the global default to android.app.Application (a no-op) keeps every
# Robolectric test using a stub. Tests that need Hilt continue to set
# @Config(application = HiltTestApplication::class) — per-test @Config always
# overrides this properties default.
#
# DO NOT remove this without setting an equivalent override on every Robolectric
# test class, or the leak comes back.
#
# See also: app/src/test/java/com/github/reygnn/kolibri_launcher/
# TESTING_CONVENTIONS.kt section "ROBOLECTRIC APPLICATION CONFIG — TWO-LAYER
# STRATEGY" for the full picture (priority order, when @Config overrides apply,
# when to skip @Config, regression hazards). Keep that section in sync if this
# file changes.
application=android.app.Application

# Robolectric ships SDK jars up to API 36 (4.16.1); the app targets 37.
# Pin the emulated SDK to 36 so Robolectric tests run against a supported
# level regardless of the app targetSdk.
sdk=36
