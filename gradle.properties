# Project-wide Gradle settings.

# IDE (Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Enable Gradle Build Cache
org.gradle.caching=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
android.useAndroidX=true

# Enable Jetifier to automatically convert older libraries to use AndroidX
android.enableJetifier=true

# Suppress warning for unsupported compileSdk version
# android.suppressUnsupportedCompileSdk=36

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# KAPT settings for better performance and stability
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=false

# Enables Kotlin compilation for the AGP `android.testFixtures` source set
# in com.android.library modules. Without this flag, AGP 8.5–8.13 register
# only `compileDebugTestFixturesJavaWithJavac`, never the Kotlin sibling,
# so any `.kt` file in `src/testFixtures/` produces a "private in file"
# error at consumer-side compile because no `.class` is published in the
# variant artifact. With the flag set, KGP registers
# `compileDebugTestFixturesKotlin` and the artifact is complete.
#
# Tracking ticket: KT-50667 (JetBrains).
# Reference write-up: brightinventions.pl/blog/current-test-fixtures-support-android.
#
# Status: experimental on AGP 8.13.2 — not in the official Android docs.
# May be revoked or renamed in a future AGP. If a future bump makes
# `compileDebugTestFixturesKotlin` register without this flag, drop the
# line. See `data/TESTFIXTURES_KOTLIN_INVESTIGATION.md` for the full
# history and the symptom fingerprint to re-recognize the gap.
android.experimental.enableTestFixturesKotlinSupport=true