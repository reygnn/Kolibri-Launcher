# Project-wide Gradle settings (monorepo). Union of Nyx + Kolibri.

# JVM args for the daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Parallel + build cache.
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true

# Kotlin code style (from Nyx).
kotlin.code.style=official

# config-cache is intentionally OFF for Phase 0: Kolibri's :app custom tasks read
# project(...).projectDir at configuration time, which config-cache rejects.
# Re-enable per app once those are made cache-compatible.

android.useAndroidX=true

# Kolibri sets this false (legacy transitive R). Kept as the safe union default:
# false = transitive R still resolves for both apps; true could break Kolibri.
android.nonTransitiveRClass=false

# Required by BOTH apps: enables Kotlin compilation for the AGP testFixtures
# source set in com.android.library modules (both use
# testImplementation(testFixtures(project(":...:domain")))). Without it, the
# testFixtures .kt files never publish a .class → consumer-side "private in
# file" errors. Tracking: KT-50667. See Kolibri
# data/TESTFIXTURES_KOTLIN_INVESTIGATION.md.
android.experimental.enableTestFixturesKotlinSupport=true
