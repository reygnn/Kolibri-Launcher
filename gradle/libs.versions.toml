# =============================================================================
# Kolibri Launcher — Gradle Version Catalog
# =============================================================================
#
# IMPORTANT: pinning markers — DO NOT IGNORE
#   - DO NOT CHANGE    = never modify
#   - DO NOT UPGRADE   = do not raise version (breaks build or tests)
#   - DO NOT DOWNGRADE = do not lower version (breaks build or tests)
#   - OK to upgrade    = safe to raise version on the next pass
#
# minSdk = compileSdk = targetSdk = 36 (Android 16) are intentional and live
# in `app/build.gradle.kts`, not in this catalog. Same for the jvmToolchain
# (21) and the AndroidX Test runner / executor settings.
#
# Cross-cutting constraints to keep in mind when bumping anything:
#   - `material` MUST resolve before `androidx.appcompat` — see the force()
#     in `app/build.gradle.kts` resolutionStrategy.
#   - `kotlin-test` (test) and the Kotlin compiler version MUST match;
#     mismatching gives "compiler errors" rather than a clean test failure.
#   - `acra` and `proguard-rules.pro` must stay in sync; changing one without
#     the other can produce silent crash-report failures in release builds.
#   - `fragment` (fragment-ktx and fragment-testing) MUST share one version.
#
# -----------------------------------------------------------------------------
# QUARTERLY RECHECK PROCESS  (TODO.md §10)
# -----------------------------------------------------------------------------
#
# Pins decay: a "DO NOT UPGRADE" that was correct in 2025 may be karavanen-
# aberglaube in 2027. To keep pin discipline from rotting into cargo cult,
# every quarter (~30 min) walk every pin and either re-confirm or lift it.
#
# Recheck format (annotate next to the marker, replace the previous date):
#   # DO NOT UPGRADE — Recheck YYYY-Qn: <kurz, was geprüft>
#
# What a recheck IS:
#   - Re-read the pin's stated reason. Is it still load-bearing?
#   - Spot-check upstream (changelog of the lib, GitHub release notes) for
#     a published fix that would make the pin lift safely.
#   - If the reason still holds, just bump the date.
#   - If the reason no longer holds, plan the lift as a separate change —
#     not as part of the recheck itself.
#
# What a recheck is NOT:
#   - Not the upgrade itself. The recheck only DECIDES whether an upgrade
#     is warranted. The actual lift goes on its own branch with its own
#     test pass.
#   - Not exhaustive. ~30 min per quarter is the budget; if a single pin
#     needs deep investigation, capture it as a separate TODO item.
#
# Latest recheck: 2026-Q3 (2026-05-06, vorgezogen) — first pass with web
#                 access; per-pin annotations below carry the findings.
# Next recheck:   2026-Q4.
#
# Cross-lib lift bundles to keep in mind (recheck 2026-Q3 surfaced these):
#   1. AGP 9 + Hilt ≥2.59 + Gradle 9.1 + kapt→ksp + (likely) Kotlin 2.3
#      — coupled. Lift one, lift all together. AGP 8.13.2 is the last
#      of the 8.x line; the next stop is the bundle. SPIKE attempted
#      2026-05-06, abandoned after 7 blockers — see TODO.md §10 for
#      the chain (kapt incompatible with built-in Kotlin → KSP1
#      incompatible with built-in Kotlin → escape-hatch needed →
#      either accept the escape-hatch as load-bearing, or migrate
#      to KSP2 which couples to bundle 2 below).
#   2. Kotlin 2.3 + kotlinx-serialization 1.10 + kotlin-test (auto-
#      matched) + KSP 2.3.x — coupled. Same logic.
#   3. JUnit 5 — standalone migration effort, no triggers visible.
# =============================================================================

[versions]
# Build & Kotlin
agp = "8.13.2"  # Recheck 2026-Q3: 8.13.2 is last of 8.x line; next stop is AGP 9.x — see cross-lib bundle 1 in header. SPIKE attempted 2026-05-06 (branch spike/agp-9-bundle, abandoned after 7 cumulative blockers) — see TODO §10 for the dependency chain that surfaced; tl;dr the bundle expands beyond just AGP+Hilt+Gradle to include kapt→ksp migration which itself couples to Kotlin 2.3 unless KSP1+escape-hatch is accepted.
kotlin = "2.2.21"  # 2.2.x — safe to update; kotlin-test must match exactly. Recheck 2026-Q3: 2.2.21 is current top of 2.2.x line. 2.3.0 would pull cross-lib bundle 2 (kotlinx-serialization 1.10, KSP 2.3) — coupled lift.
ksp = "2.2.21-2.0.4"  # not currently used; kept for the eventual KSP migration. Recheck 2026-Q3: matched to kotlin pin; KSP1 is deprecated, KSP2 line is 2.3.x — coupled to Kotlin 2.3 lift.

# Hilt
hilt = "2.58"  # DO NOT UPGRADE — 2.59 requires AGP 9 (cross-lib bundle 1). Recheck 2026-05-15: lifted from 2.57.2; 2.58 is the last release that supports AGP 8.x. The flipped `dagger.useBindingGraphFix` default is on; rollback flag = `dagger.useBindingGraphFix=disabled` in `gradle.properties` if a latent binding-graph issue surfaces.

# UI / Material
material = "1.13.0"  # DO NOT DOWNGRADE — must load BEFORE appcompat (force() in app/build.gradle.kts). Recheck 2026-Q3: current = latest stable (2026-03-11).
appcompat = "1.7.1"  # bringt älteres MaterialYou mit; deshalb material vorrang. Recheck 2026-Q3: current = latest stable (no 1.8.x stable in sight).
core-ktx = "1.18.0"  # Recheck 2026-Q3: lifted from 1.17.0 (2026-05-06); additive minor, no breaking changes.
core-splashscreen = "1.2.0"  # Recheck 2026-Q3: current = latest stable.
activity = "1.13.0"  # Recheck 2026-Q3: lifted from 1.12.4 (2026-05-06). Note: 1.13.0 re-invokes EdgeToEdge on config-changes (rotation, theme switch) — verified harmless in this codebase via the existing instrumented suite.
fragment = "1.8.9"  # DO NOT UPGRADE — fragment-ktx and fragment-testing share this. Recheck 2026-Q3: current = latest stable in 1.8.x; 1.9.x not stable yet.
recyclerview = "1.4.0"  # Recheck 2026-Q3: current = latest stable.

# Lifecycle & Navigation
lifecycle = "2.10.0"  # OK to upgrade. Recheck 2026-Q3: current = latest stable (2.11.x is alpha).
navigation = "2.9.8"  # OK to upgrade. Recheck 2026-05-15: lifted 2.9.7 → 2.9.8 (patch on 2.9.x line); 2.10.x still alpha.

# Data & Async
datastore = "1.2.1"  # Recheck 2026-Q3: current = latest stable.
preference = "1.2.1"  # Recheck 2026-Q3: current = latest stable.
coroutines = "1.11.0"  # OK to upgrade. Recheck 2026-05-15: lifted 1.10.2 → 1.11.0 (1.11.0 went stable 2026-05-08).
kotlinx-serialization = "1.9.0"  # 1.10.0 needs Kotlin 2.3.0 — bump together. Recheck 2026-Q3: pin reason still applies; coupled to header bundle 2.

# Utilities
timber = "5.0.1"  # Recheck 2026-05-15: 5.0.1 is the only stable release; no 6.x line exists, only 5.1.0-SNAPSHOT in trunk. The previous DO-NOT-UPGRADE marker referenced "6.x breaking changes" that don't exist — dropped. Re-add the marker IF a 6.x ships and turns out hostile.
acra = "5.13.1"  # DO NOT UPGRADE — proguard-rules.pro must stay in sync. Recheck 2026-05-15: lifted 5.11.4 → 5.13.1 (5.12 brought R8 hardening + custom notification channels; 5.13 brought TLS fix + Android 36 target + schedule-failure logging). proguard-rules.pro keeps are package-wide (`-keep class org.acra.**`) — verified compatible. Header comment in proguard-rules.pro updated.
browser = "1.10.0"  # Recheck 2026-05-15: lifted 1.9.0 → 1.10.0 (developer.android.com stable channel now lists 1.10.0).
leakcanary = "2.14"  # Recheck 2026-Q3: current = latest stable.
json = "20251224"  # Recheck 2026-Q3: current = latest stable (Dec 2025; org.json uses YYYYMMDD versioning).

# Test (JVM)
junit = "4.13.2"  # DO NOT UPGRADE — JUnit 5 needs migration. Recheck 2026-Q3: current = latest 4.x stable. JUnit 5 lift is its own migration effort, no triggers visible.
core-testing = "2.2.0"  # DO NOT CHANGE. Recheck 2026-Q3: current = latest stable; pin marker stays.
kotlin-test = "2.2.21"  # DO NOT DOWNGRADE — 1.9.23 causes compiler errors; must match `kotlin`. Recheck 2026-Q3: matched to kotlin pin; couples to Kotlin 2.3 lift.
turbine = "1.2.1"  # OK to upgrade. Recheck 2026-Q3: current = latest stable (1.3.0-SNAPSHOT in trunk).
truth = "1.4.5"  # OK to upgrade. Recheck 2026-Q3: current = latest stable.
robolectric = "4.16.1"  # OK to upgrade. Recheck 2026-Q3: current = latest stable; supports SDK 36 + JDK 21 — fits the project.
mockk = "1.14.9"  # Recheck 2026-Q3: current = latest stable (2026-01-26; clearAllStubsFromMemory + any()-fix shipped here).

# AndroidX Test (keep ALL in sync — runner/rules/core/junit-ktx)
# `androidxTest` is camelCase to avoid an accessor-namespace clash with
# `androidx-test-core` / `androidx-test-junit`: hyphen-keys are mapped to
# dot-paths, so a leaf `androidx-test` would collide with the prefix.
androidxTest = "1.7.0"  # Recheck 2026-Q3: current = latest stable.
androidx-test-core = "1.7.0"  # Recheck 2026-Q3: current = latest stable; force-pinned in app/build.gradle.kts to dodge consistent-resolution downgrade — see commit bd0d236 for the ActivityInvoker$-CC story.
androidx-test-junit = "1.3.0"  # Recheck 2026-Q3: current = latest stable.
espresso = "3.7.0"  # Recheck 2026-Q3: current = latest stable.
orchestrator = "1.6.1"  # Recheck 2026-Q3: current = latest stable.


