# Robolectric defaults for :common-data unit tests. Mirrors :data.
#
# :common-data's manifest declares no android:name, so the default Application
# would already be android.app.Application; pin it explicitly to keep the
# contract uniform across modules.
application=android.app.Application

# Robolectric ships SDK jars up to API 36; the module compiles against 37.
# Pin the emulated SDK to 36 so Robolectric tests run against a supported level.
sdk=36
