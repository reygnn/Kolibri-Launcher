# Robolectric defaults for :common-ui unit tests.
#
# Robolectric ships SDK jars up to API 36 (4.16.1); this module compiles/targets 37.
# Pin the emulated SDK to 36 so Robolectric runs against a supported level regardless
# of compileSdk (mirrors :data / :app). Without this, DefaultSdkPicker throws on 37.
sdk=36

# Pin the Application explicitly so a future library-side manifest can't silently
# change Robolectric loading behavior (uniform with the other modules' properties).
application=android.app.Application
